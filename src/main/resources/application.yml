server:
  port: 8092
spring:
  profiles:
    active: dev
  application:
    name: knowledge_point_platform # 应用名称(也做为SHA-256加解密的盐值)
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://127.0.0.1:3306/jfsc?useUnicode=true&characterEncoding=UTF8&useSSL=false&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  # Redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:    # 无密码留空
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # 邮件发送开始
  mail:
    host: smtp.qq.com
    port: 587
    username: 1192704429@qq.com  # 替换为您的QQ邮箱地址
    password: cjfvrpajqimvhgdb  # 替换为您的QQ邮箱授权码
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# 本地文件上传配置开始
file:
  upload-dir: D:\\uploads\\  # 上传文件的目录
  access-url: http://localhost:${server.port}/uploads  # 访问文件的URL前缀
# 本地文件上传配置结束

secret-key: 1234567890123456 # 密钥(默认值)
check-captcha: false  # 是否开启验证码校验

mybatis-plus:
  #sql语句Xml扫描
  mapper-locations: classpath:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.kp.mall.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型 AUTO:"数据库ID自增",INPUT:"用户输入ID",ID_WORKER:"全局唯一ID (数字类型唯一ID)",UUID:"全局唯一ID UUID";
      id-type: AUTO
      logic-delete-field: 1
      logic-not-delete-value: 0
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'


# 通用大模型聊天接口配置（DeepSeek / OpenAI 风格）
